function resetCompose(){pickShape=null;composeText="";composeDraw=null;composeInk=false;drawMode=false;}

function setupCanvas(cv){
  const ctx=cv.getContext("2d");let down=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};};
  function dab(x,y){
    if(penTool==="eraser"){ctx.save();ctx.globalCompositeOperation="destination-out";ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();ctx.restore();return;}
    if(penTool==="pencil"){ctx.fillStyle="rgba(70,70,82,.55)";for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(x+(Math.random()-.5)*1.6,y+(Math.random()-.5)*1.6,.8+Math.random()*.5,0,7);ctx.fill();}return;}
    ctx.fillStyle=penColor;
    for(let i=0;i<9;i++){const a=Math.random()*6.283,r=Math.random()*4.2;ctx.globalAlpha=.45+Math.random()*.4;ctx.beginPath();ctx.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,1+Math.random()*1.5,0,7);ctx.fill();}
    ctx.globalAlpha=1;
  }
  function seg(a,b){const d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(d/2));for(let i=1;i<=n;i++)dab(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n);}
  cv.onpointerdown=e=>{if(!drawMode)return;down=true;drawing=true;last=pos(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}dab(last.x,last.y);e.preventDefault();};
  cv.onpointermove=e=>{if(!down)return;const p=pos(e);seg(last,p);last=p;e.preventDefault();};
  const end=()=>{if(!down)return;down=false;drawing=false;composeInk=true;composeDraw=cv.toDataURL("image/png");if(dirty){dirty=false;render();}};
  cv.onpointerup=end;cv.onpointercancel=end;
}

const TAPEC=["#ffd6e6","#cfe8ff","#d8f5d0","#fff0b3","#e5d8ff","#ffe0c2"];
function boardNote(p,ghost){
  const si=typeof p.shape==="number"&&SH[p.shape]?p.shape:1,S=SH[si],id=p.id,len=(p.text||"").length;
  let w=len<=12?96:len<=36?120:len<=80?152:184;const fk=len<=12?1:len<=36?.92:len<=80?.8:.68;if(S.k==="star")w+=24;if(S.k==="circle")w+=12;if(S.k==="moon")w+=34;if(S.k==="heart")w+=20;if(S.k==="paper")w=124;const kz=typeof p.sz==="number"?p.sz:1;w=Math.round(w*kz);
  const legacy=typeof p.shape!=="number"&&typeof p.color==="number"&&PCOL[p.color]?PCOL[p.color].c:null;
  const x=typeof p.px==="number"?p.px:22+hash(id+"x")%56,y=typeof p.py==="number"?p.py:16+hash(id+"y")%66;
  const wrap=el("div","pn"+(ghost?" ghost":""));
  wrap.style.cssText=`left:${x}%;top:${y}%;transform:translate(-50%,-50%) rotate(${typeof p.rot==="number"?p.rot:(hash(id+"r")%9)-4}deg);z-index:${1+hash(id+"z")%5}`;
  const tp=el("span","tape"),rv=hash(id+"v"),ra=(hash(id+"t")%21)-10,tw=48+hash(id+"w")%16,pos=28+hash(id+"p")%40,vr=(S.k==="square"||S.k==="paper")?5:3;
  const tv=[`top:-9px;left:${pos}%;margin-left:-${tw/2}px;width:${tw}px;transform:rotate(${ra}deg)`,`left:${-tw/2}px;top:calc(${pos}% - 8px);width:${tw}px;transform:rotate(${90+ra}deg)`,`right:${-tw/2}px;top:calc(${pos}% - 8px);width:${tw}px;transform:rotate(${90+ra}deg)`,`left:-18px;top:0;width:${tw}px;transform:rotate(-42deg)`,`right:-18px;top:0;width:${tw}px;transform:rotate(42deg)`][rv%vr];
  tp.style.cssText=tv+`;background-color:${TAPEC[hash(id+"c")%TAPEC.length]}`;
  const f=el("div","pf sh-"+S.k);
  f.style.cssText=`width:${w}px;background:${legacy||S.c};`+(S.k==="square"?`min-height:${Math.round(w*.62)}px;padding:16px 14px 18px`:`aspect-ratio:${S.k==="heart"?"1/0.93":"1/1"};padding:${S.pad[0]}% ${S.pad[1]}% ${S.pad[2]}% ${S.pad[3]}%`);
  const t=el("div","ptxt",p.text||"");t.style.cssText=`font-size:${((S.fs-2)*fk*kz).toFixed(1)}px`;
  f.appendChild(t);
  if(p.draw){const im=el("img","pdraw");im.src=p.draw;im.alt="";f.appendChild(im);}
  wrap._w=w/kz;wrap._fs=(S.fs-2)*fk;wrap._sq=S.k==="square";wrap.append(tp,f);
  if(!ghost){
    if(isAdmin&&selMode)wrap.appendChild(chk(p));
    wrap.style.touchAction="none";
    let st=null,mvd=false,lx=0,ly=0;
    wrap.onpointerdown=e=>{if(isAdmin&&selMode)return;st={x:e.clientX,y:e.clientY};mvd=false;};
    wrap.onpointermove=e=>{
      if(!st)return;
      if(!mvd){if(Math.hypot(e.clientX-st.x,e.clientY-st.y)<8)return;mvd=true;drawing=true;wrap.style.zIndex=30;try{wrap.setPointerCapture(e.pointerId);}catch(_){}}
      const g=wrap.parentElement,r=g.getBoundingClientRect(),iw=g.clientWidth,ih=g.clientHeight,mx=wrap.offsetWidth/2/iw*100,my=wrap.offsetHeight/2/ih*100;
      lx=Math.min(100-mx,Math.max(mx,(e.clientX-r.left-g.clientLeft)/iw*100));ly=Math.min(100-my,Math.max(my,(e.clientY-r.top-g.clientTop)/ih*100));
      wrap.style.left=lx+"%";wrap.style.top=ly+"%";
    };
    const end=async()=>{
      if(!st)return;const was=mvd;st=null;if(!was)return;
      drawing=false;wrap._moved=true;setTimeout(()=>{wrap._moved=false;},80);
      try{await updateDoc(doc(db,"posts",p.id),{px:lx,py:ly});}catch(e){alert("위치를 바꾸지 못했어요.");render();}
      if(dirty){dirty=false;render();}
    };
    wrap.onpointerup=end;wrap.onpointercancel=end;
    wrap.onclick=()=>{if(wrap._moved)return;if(isAdmin&&selMode)selTog(p);else openPost(p);};
  }
  return wrap;
}
function renderPlace(){
  $main.appendChild(el("div","pickhead","끌어서 옮기고, 모서리는 크기, 위의 파란 동그라미는 방향을 돌려요"));
  const row=el("div","row");row.style.cssText="margin:0 0 12px;justify-content:center";
  const ok=el("button","pri","✔ 여기에 붙이기"),no=el("button","","취소");
  ok.onclick=async()=>{
    ok.disabled=true;
    const full={...placing,px:placeX,py:placeY,sz:placing.sz||1,rot:Math.round(placing.rot||0)},ref=collection(db,"posts");
    try{
      try{await addDoc(ref,full);}
      catch(e){
        try{const d2={...full};delete d2.rot;await addDoc(ref,d2);alert("회전은 저장하지 못했어요.");}
        catch(e2){const d={...placing};delete d.sz;delete d.rot;await addDoc(ref,d);alert("위치와 크기는 저장하지 못해서 자동 위치로 붙였어요.");}
      }
      placing=null;resetCompose();sent=true;render();
    }catch(e){ok.disabled=false;alert("붙이지 못했어요. 다시 시도해주세요.");}
  };
  no.onclick=()=>{placing=null;render();};
  row.append(ok,no);$main.appendChild(row);
  const g=el("div","cork");
  posts.filter(p=>catOf(p)==="board").forEach(p=>g.appendChild(boardNote(p)));
  let gh,dr=false;
  const clampPos=()=>{
    const iw=g.clientWidth,ih=g.clientHeight,mx=(gh.offsetWidth/2+12)/iw*100,my=(gh.offsetHeight/2+44)/ih*100;
    placeX=Math.min(100-mx,Math.max(mx,placeX));placeY=Math.min(100-my,Math.max(my,placeY));
    gh.style.left=placeX+"%";gh.style.top=placeY+"%";
  };
  const move=e=>{
    const r=g.getBoundingClientRect();
    placeX=(e.clientX-r.left-g.clientLeft)/g.clientWidth*100;placeY=(e.clientY-r.top-g.clientTop)/g.clientHeight*100;clampPos();
  };
  const fin=()=>{drawing=false;if(dirty){dirty=false;render();}};
  const size=(n,k)=>{
    const f=n.querySelector(".pf"),t=n.querySelector(".ptxt");
    f.style.width=Math.round(n._w*k)+"px";if(n._sq)f.style.minHeight=Math.round(n._w*k*.62)+"px";
    t.style.fontSize=(n._fs*k).toFixed(1)+"px";
  };
  const ctr=n=>{const r=n.querySelector(".pf").getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};};
  const mk=()=>{
    const n=boardNote({...placing,id:"ghost"+placing.ts},true);n.style.left=placeX+"%";n.style.top=placeY+"%";
    n.onpointerdown=e=>{dr=true;drawing=true;try{n.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();};
    n.onpointermove=e=>{if(dr)move(e);};
    n.onpointerup=n.onpointercancel=()=>{if(dr){dr=false;fin();}};
    ["top:-10px;left:-10px","top:-10px;right:-10px","bottom:-10px;left:-10px","bottom:-10px;right:-10px"].forEach(pos=>{
      const h=el("span","rh");h.style.cssText=pos;
      let c0,d0,k0,rs=false;
      h.onpointerdown=e=>{e.stopPropagation();e.preventDefault();c0=ctr(n);d0=Math.hypot(e.clientX-c0.x,e.clientY-c0.y)||1;k0=placing.sz||1;rs=true;drawing=true;try{h.setPointerCapture(e.pointerId);}catch(_){}};
      h.onpointermove=e=>{if(!rs)return;const k=Math.min(2,Math.max(.5,k0*Math.hypot(e.clientX-c0.x,e.clientY-c0.y)/d0));placing.sz=k;size(n,k);};
      h.onpointerup=h.onpointercancel=()=>{if(rs){rs=false;clampPos();fin();}};
      n.appendChild(h);
    });
    const st=el("i","rstem"),rh=el("span","rh rot");
    let rr=false;
    rh.onpointerdown=e=>{e.stopPropagation();e.preventDefault();rr=true;drawing=true;try{rh.setPointerCapture(e.pointerId);}catch(_){}};
    rh.onpointermove=e=>{
      if(!rr)return;const c=ctr(n);let a=Math.atan2(e.clientY-c.y,e.clientX-c.x)*180/Math.PI+90;
      if(a>180)a-=360;for(const t of[-180,-90,0,90,180])if(Math.abs(a-t)<5)a=t;
      placing.rot=a;n.style.transform=`translate(-50%,-50%) rotate(${a}deg)`;
    };
    rh.onpointerup=rh.onpointercancel=()=>{if(rr){rr=false;fin();}};
    n.append(st,rh);
    return n;
  };
  gh=mk();g.appendChild(gh);$main.appendChild(g);
  g.onclick=e=>{if(!gh.contains(e.target))move(e);};
}

function renderBoard(){
  if(!cat){$main.appendChild(el("div","empty hintdoor","문을 눌러 들어가보세요 🌙"));return;}
  const ci=info(cat),isW=cat==="worry";
  if(openKey){
    const p=posts.find(x=>catOf(x)===cat&&postKey(x)===openKey);
    if(p){
      const cb=el("button","","← 닫기");cb.onclick=()=>{openKey=null;render();};
      const gap=el("div");gap.style.height="12px";
      $main.append(cb,gap,postCard(p));return;
    }
    openKey=null;
  }
  if(sent)$main.appendChild(el("div","msg",isW?"접수됐어요! 관리자가 확인한 뒤 올라가요.":"메모판에 붙였어요! 🎀"));
  if(!isW&&placing){renderPlace();return;}
  if(isW){
    const btn=el("button","pri",showForm?"닫기":ci.write);
    btn.onclick=()=>{showForm=!showForm;sent=false;render();};
    $main.appendChild(btn);
    if(showForm){
      const ti=el("input");ti.placeholder="제목";ti.maxLength=50;ti.style.cssText="width:100%;margin-top:10px";$main.appendChild(ti);
      const ta=el("textarea");ta.placeholder="내용";ta.maxLength=1000;ta.style.marginTop="10px";
      const go=el("button","pri","보내기");go.style.marginTop="8px";
      go.onclick=async()=>{
        const t=ta.value.trim(),ttl=ti.value.trim();
        if(!t||!ttl){alert("제목과 내용을 모두 적어주세요.");return;}
        go.disabled=true;
        try{await addDoc(collection(db,"pending"),{text:t,title:ttl,ts:Date.now(),cat});showForm=false;sent=true;render();}
        catch(e){go.disabled=false;alert("보내지 못했어요. 다시 시도해주세요.");}};
      $main.append(ta,go);
    }
  }else{
    $main.appendChild(el("div","pickhead","포스트잇을 골라보세요"));
    const sw=el("div","swatches");
    PICK.forEach(i=>{const S=SH[i];
      const b=el("button","sw"+(pickShape===i?" sel":""));
      const f=el("span","swf sh-"+S.k);f.style.background=S.c;b.appendChild(f);
      b.setAttribute("aria-label",S.n);b.title=S.n;if(S.k==="paper"){Object.assign(f.style,{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontSize:"12px",lineHeight:"1.25",color:"#4a5578",fontWeight:"700"});f.innerHTML="🎨<br>도화지";}
      b.onclick=()=>{pickShape=pickShape===i?null:i;drawMode=false;composeDraw=null;composeInk=false;sent=false;render();};
      sw.appendChild(b);
    });
    $main.appendChild(sw);
    if(pickShape!==null&&SH[pickShape].k==="paper")$main.appendChild(el("div","atxt","포스트잇이 아니라 그림을 그릴 수 있는 도화지예요 🎨"));
    if(pickShape!==null)renderComposer();
  }
  const sp=el("div");sp.style.height="16px";$main.appendChild(sp);
  if(isAdmin){
    const tb=el("div","row");tb.style.margin="0 0 12px";tb.style.flexWrap="wrap";
    const tg=el("button",selMode?"on":"",selMode?"선택 끝내기":"☑️ 선택 삭제");
    tg.onclick=()=>{selMode=!selMode;sel.clear();render();};tb.appendChild(tg);
    if(selMode){
      const vis=posts.filter(p=>catOf(p)===cat),allOn=vis.length>0&&vis.every(p=>sel.has(p.id));
      const all=el("button","",allOn?"전체 해제":"전체 선택");
      all.onclick=()=>{vis.forEach(p=>allOn?sel.delete(p.id):sel.add(p.id));render();};
      const n=vis.filter(p=>sel.has(p.id)).length,del=el("button","danger",`🗑️ ${n}개 삭제`);del.disabled=!n;
      del.onclick=async()=>{
        if(!confirm(`${n}개를 휴지통으로 보낼까요?`))return;del.disabled=true;
        try{await trashPosts(vis.filter(p=>sel.has(p.id)));sel.clear();selMode=false;render();}
        catch(e){alert("일부를 삭제하지 못했어요.");render();}
      };
      tb.append(all,del);
    }
    $main.appendChild(tb);
  }
  const list=posts.filter(p=>catOf(p)===cat);
  if(!list.length&&isW){$main.appendChild(el("div","empty","아직 올라온 글이 없어요."));return;}
  if(isW){
    const g=el("div","mlist");
    list.sort((a,b)=>a.n-b.n).forEach(p=>{
      const m=el("button","mrow");
      const mm=el("span","mm");mm.innerHTML=crescent("n"+postKey(p).replace(/[^a-z0-9]/gi,""));
      const mt=el("span","mt");
      mt.append(el("span","mtt","#"+dispNo(p)+" "+(p.title||"(제목 없음)")),el("span","mtc",`댓글 ${comments.filter(c=>c.postId===postKey(p)).length}`));

      if(isNew(p))m.appendChild(el("span","new","NEW"));
      if(isAdmin&&selMode)m.appendChild(chk(p));m.onclick=()=>{if(isAdmin&&selMode)selTog(p);else openPost(p);};
      g.appendChild(m);

  }else{
    const g=el("div","cork");
    if(!list.length)g.appendChild(el("div","atxt","메모판이 비어 있어요. 메모지를 붙여보세요!"));
    list.sort((a,b)=>(b.ts||0)-(a.ts||0)).forEach(p=>g.appendChild(boardNote(p)));
    $main.appendChild(g);
  }
}

function paintNote(n,id,len,ci){
  const h=hash(id),mw=Math.min(120+Math.min(len,90)*2.6+(h%40),300);
  const pc=(typeof ci==="number"&&PCOL[ci])?PCOL[ci]:null;
  const bg=pc?pc.c:COLORS[h%COLORS.length],tc=pc?pc.t:TAPES[hash(id+"c")%TAPES.length];
  n.style.cssText=`background-color:${bg};max-width:min(100%,${mw}px);padding:${13+(h%5)}px ${13+(h%6)}px ${19+(h%7)}px;transform:rotate(${(hash(id+"r")%7)-3}deg);--tw:${28+(h%44)}px;--tl:${6+(hash(id+"l")%58)}%;--tr:${(hash(id+"t")%15)-7}deg;--tt:${-10+(h%5)}px;--th:${11+(h%7)}px;--tc:${tc}`;
}

function editComment(m){
  const t=prompt("댓글 수정",m.text);if(t===null)return;const v=t.trim();if(!v||v.length>200)return;
  updateDoc(doc(db,"comments",m.id),{text:v}).catch(()=>alert("수정하지 못했어요. Firebase 규칙을 확인해주세요."));
}
function iconBtn(ico,label,fn){const b=el("button","ic",ico);b.setAttribute("aria-label",label);b.title=label;b.onclick=fn;return b;}

function postCard(p){
  const c=el("div","post"),isW=catOf(p)==="worry",key=postKey(p);
  const no=el("div","no",p.n!=null?`#${dispNo(p)}번째 ${info(catOf(p)).unit}`:"메모판 글");
  if(viewNew.has(p.id))no.appendChild(el("span","new in","NEW"));
  c.appendChild(no);
  if(p.title)c.appendChild(el("div","ptitle",p.title));
  c.appendChild(el("div","txt",p.text));
  if(p.draw){const im=el("img","drawfull");im.src=p.draw;im.alt="";c.appendChild(im);}
  if(isAdmin){
    const row=el("div","row");row.style.margin="0 0 8px";
    row.append(
      iconBtn("✏️","수정",()=>{
        let ti=p.title;
        if(isW){const t=prompt("제목 수정",p.title||"");if(t===null)return;ti=t.trim();if(!ti)return;}
        const x=prompt("내용 수정",p.text);if(x===null||!x.trim())return;
        const u={text:x.trim()};if(isW)u.title=ti;
        updateDoc(doc(db,"posts",p.id),u).catch(()=>alert("수정하지 못했어요."));
      }),
      iconBtn("🗑️","삭제",async()=>{
        if(!confirm("이 글을 휴지통으로 보낼까요? 댓글도 같이 가요."))return;
        try{await trashPosts([p]);openKey=null;render();}
        catch(e){alert("삭제하지 못했어요.");}
      })
    );
    c.appendChild(row);
  }
  if(!isW)return c;
  const list=comments.filter(m=>m.postId===key).sort((a,b)=>a.ts-b.ts);
  const box=el("div","bcs");
  box.appendChild(el("div","chead",`댓글 ${list.length}`));
  list.forEach(m=>{
    const d=el("div","bc"),body=el("div","bcb"),head=el("div","bch");
    const mo=el("span","cmoon");mo.innerHTML=crescent("c"+m.id.replace(/[^a-z0-9]/gi,""));head.appendChild(mo);
    head.appendChild(el("span","",fmtBlog(m.ts)));
    if(viewNew.has(m.id))head.appendChild(el("span","new in","NEW"));
    if(isAdmin){
      const r=el("span","bcr");
      r.append(iconBtn("✏️","수정",()=>editComment(m)),iconBtn("🗑️","삭제",()=>{if(confirm("이 댓글을 휴지통으로 보낼까요?"))trashComment(m,p).catch(()=>alert("삭제하지 못했어요."));}));
      head.appendChild(r);
    }
    body.append(head,el("div","bct",m.text));
    d.append(body);box.appendChild(d);
  });
  c.appendChild(box);
  const form=el("div","cform");
  const ta=el("textarea");ta.placeholder="댓글을 남겨보세요";ta.maxLength=200;
  const b=el("button","pri","올리기");
  b.onclick=()=>{const t=ta.value.trim();if(!t)return;ta.value="";addDoc(collection(db,"comments"),{postId:key,text:t,ts:Date.now()}).catch(()=>alert("올리지 못했어요."));};
  form.append(ta,b);c.appendChild(form);return c;
}

function renderReview(){
  if(!pending.length){$main.appendChild(el("div","empty","검수할 글이 없어요 🌙"));return;}
  [...pending].sort((a,b)=>a.ts-b.ts).forEach(r=>{
    const k=catOf(r);
    const c=el("div","post");
    const nn=el("div","no",`검수 대기 · ${k==="worry"?"고민":"게시판"}`);nn.appendChild(el("span","new in","NEW"));c.appendChild(nn);
    if(r.title)c.appendChild(el("div","ptitle",r.title));
    c.appendChild(el("div","txt",r.text));
    const row=el("div","row");
    const ok=el("button","pri","수락 → 게시");
    ok.onclick=async()=>{ok.disabled=true;
      try{await runTransaction(db,async tx=>{
        const cref=doc(db,"meta",counterId(k));const s=await tx.get(cref);
        const n=(s.exists()?s.data().n:0)+1;
        const d={n,cat:k,text:r.text,ts:Date.now()};if(r.title)d.title=r.title;
        tx.set(cref,{n});tx.set(doc(db,"posts",k+"-"+n),d);tx.delete(doc(db,"pending",r.id));
      });}catch(e){alert("처리하지 못했어요.");ok.disabled=false;}};
    const no=el("button","danger","거부 → 휴지통");
    no.onclick=async()=>{no.disabled=true;
      try{const d={text:r.text,ts:r.ts,cat:k,rejectedAt:Date.now()};if(r.title)d.title=r.title;await setDoc(doc(db,"trash",r.id),d);await deleteDoc(doc(db,"pending",r.id));}
      catch(e){alert("처리하지 못했어요.");no.disabled=false;}};
    row.append(ok,no);c.appendChild(row);$main.appendChild(c);
  });
}

function renderTrash(){
  if(!trash.length){$main.appendChild(el("div","empty","휴지통이 비어 있어요."));return;}
  [["board","포스트잇"],["worry","고민 + 댓글"]].forEach(([fk,fl])=>{
    const items=trash.filter(t=>(catOf(t)==="worry"?"worry":"board")===fk).sort((a,b)=>(b.delAt||b.rejectedAt||0)-(a.delAt||a.rejectedAt||0));
    const open=trashOpen[fk],hd=el("button","pri",`${open?"📂":"📁"} ${fl} (${items.length})`);
    hd.style.cssText="width:100%;text-align:left;margin-bottom:10px";
    hd.onclick=()=>{trashOpen[fk]=!open;render();};$main.appendChild(hd);
    if(!open)return;
    if(!items.length){const e=el("div","empty","비어 있어요.");e.style.padding="8px 0 18px";$main.appendChild(e);return;}
    const ids=items.map(t=>t.id),allOn=ids.every(i=>trashSel.has(i)),n=ids.filter(i=>trashSel.has(i)).length;
    const row=el("div","row");row.style.cssText="margin:0 0 10px;flex-wrap:wrap";
    const all=el("button","",allOn?"전체 해제":"전체 선택");all.onclick=()=>{ids.forEach(i=>allOn?trashSel.delete(i):trashSel.add(i));render();};
    const del=el("button","danger",`🗑️ ${n}개 영구 삭제`);del.disabled=!n;
    del.onclick=async()=>{
      if(!confirm(`${n}개를 영구 삭제할까요? 되돌릴 수 없어요.`))return;del.disabled=true;
      try{for(const i of ids.filter(i=>trashSel.has(i))){await deleteDoc(doc(db,"trash",i));trashSel.delete(i);}render();}
      catch(e){alert("삭제하지 못했어요.");render();}
    };
    row.append(all,del);$main.appendChild(row);
    items.forEach(t=>{
      const on=trashSel.has(t.id),c=el("div","post");c.style.cursor="pointer";
      c.onclick=()=>{on?trashSel.delete(t.id):trashSel.add(t.id);render();};
      const lab=t.kind==="comment"?"댓글"+(t.from?" · "+t.from:""):(t.delAt?"삭제됨":"거부됨");
      c.appendChild(el("div","no",`${on?"☑️":"⬜"} ${lab} · ${fmtBlog(t.delAt||t.rejectedAt)}`));
      if(t.title)c.appendChild(el("div","ptitle",t.title));
      c.appendChild(el("div","txt",t.text));
      if(t.draw){const im=el("img","drawfull");im.src=t.draw;im.alt="";im.style.maxWidth="200px";c.appendChild(im);}
      if(t.comments&&t.comments.length){c.appendChild(el("div","chead",`댓글 ${t.comments.length}`));t.comments.forEach(m=>c.appendChild(el("div","cmt",m.text)));}
      $main.appendChild(c);
    });
  });
}

function listen(name,setter,ord){
  return onSnapshot(query(collection(db,name),orderBy(ord)),s=>{setter(s.docs.map(d=>({id:d.id,...d.data()})));safeRender();},()=>{});
}
function startSubs(){
  unsubs.forEach(u=>u());unsubs=[];
  unsubs.push(listen("posts",a=>{posts=a;setTimeout(()=>window.__gate.ready(),0);},"ts"));
  unsubs.push(listen("comments",a=>comments=a,"ts"));
  subDay=dkey();
  unsubs.push(onSnapshot(query(collection(db,"attend"),where("d","==",subDay)),s=>{attend=s.docs.map(d=>({id:d.id,...d.data()}));safeRender();},()=>{}));
  unsubs.push(onSnapshot(doc(db,"visits",subDay),s=>{visitsN=s.exists()?(s.data().n||0):0;renderCal();},()=>{}));
  if(isAdmin){unsubs.push(listen("pending",a=>pending=a,"ts"));unsubs.push(listen("trash",a=>trash=a,"ts"));}
  else{pending=[];trash=[];}
}

setInterval(()=>{if(db&&dkey()!==subDay)startSubs();safeRender();},300000);
window.__entered.then(()=>{
app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);
onAuthStateChanged(auth,u=>{
  if(!u){signInAnonymously(auth).catch(()=>{window.__gate.msg("접속에 실패했어요. 앱을 나갔다가 다시 들어와주세요 🌙");$main.innerHTML="";$main.appendChild(el("div","msg","접속에 실패했어요. 잠시 뒤 다시 열어주세요."));});return;}
  isAdmin=!u.isAnonymous;startSubs();render();
  if(!counted){counted=true;setDoc(doc(db,"visits",dkey()),{n:increment(1)},{merge:true}).catch(()=>{});}
});
});
</script>
